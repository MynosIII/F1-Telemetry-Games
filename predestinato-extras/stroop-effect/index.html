<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stroop Effect Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>Stroop Effect Test</h1>
        <p class="instructions">Click the button that matches the <strong>COLOR</strong> of the text, not the word itself!</p>
        
        <div class="stats">
            <div class="score-board">Score: <span id="score">0</span></div>
            <div class="timer-board">Time: <span id="time">2.0</span>s</div>
        </div>

        <div class="progress-bar-container">
            <div id="progress-bar"></div>
        </div>

        <div class="word-display" id="word-display">
            Ready?
        </div>

        <div class="color-buttons" id="color-buttons">
            <!-- Buttons generated by JS -->
        </div>

        <div class="game-over" id="game-over" style="display: none;">
            <h2>Game Over!</h2>
            <p id="game-over-reason" style="font-size: 1.1rem; color: #ff6b6b; margin-bottom: 15px;"></p>
            <p>Final Score: <span id="final-score">0</span></p>
            <button id="restart-btn" class="action-btn">Play Again</button>
        </div>
        
        <div class="start-screen" id="start-screen">
            <button id="start-btn" class="action-btn">Start Game</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
