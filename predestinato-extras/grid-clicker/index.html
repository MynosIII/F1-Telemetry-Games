<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Clicker</title>
    <meta name="description" content="A fast-paced whack-a-mole style grid clicker game.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>Grid Clicker</h1>
            <div class="stats">
                <div class="stat">
                    <span class="stat-label">Score</span>
                    <span class="stat-value" id="score">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Lives</span>
                    <span class="stat-value" id="lives">3</span>
                </div>
            </div>
            <button class="btn" id="start-btn">Start Game</button>
        </div>
        
        <div class="grid-wrapper" style="position: relative;">
            <div class="grid" id="grid">
                <!-- Grid items generated by JS -->
            </div>
            <div class="game-over" id="game-over">
                <h2>Game Over</h2>
                <div style="font-size: 1.25rem; color: #94a3b8; margin-bottom: 1rem;">Final Score: <span id="final-score" style="color: #f8fafc; font-weight: 700;">0</span></div>
                <button class="btn" id="restart-btn">Play Again</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
