<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aim Trainer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Start Screen -->
        <div id="start-screen" class="screen active">
            <h1>Aim Trainer</h1>
            <p>Click the targets before they shrink to nothing.</p>
            <button id="start-btn" class="primary-btn">Start Game</button>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen">
            <div id="hud">
                <div class="hud-item">Score: <span id="score">0</span></div>
                <div class="hud-item">Level: <span id="level">1</span></div>
                <div class="hud-item">Lives: <span id="lives">3</span></div>
            </div>
            <div id="game-area"></div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="screen">
            <h2>Game Over</h2>
            <p>Final Score: <span id="final-score">0</span></p>
            <button id="restart-btn" class="primary-btn">Play Again</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
