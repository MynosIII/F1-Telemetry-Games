<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Images Checker</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; }
        .card { background: #222; border-radius: 8px; overflow: hidden; text-align: center; border: 1px solid #444; }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .card h3 { font-size: 14px; margin: 10px; }
        .missing { border-color: red; }
    </style>
</head>
<body>
    <h1>Driver Images Checker</h1>
    <div class="grid" id="grid"></div>

    <script>
        const SILHOUETTE_URL = "https://upload.wikimedia.org/wikipedia/commons/thumb/1/12/User_icon_2.svg/200px-User_icon_2.svg.png";

        fetch('shared/driver_images.json')
            .then(res => res.json())
            .then(data => {
                const grid = document.getElementById('grid');
                
                // Sort data: Missing first, then alphabetical
                const entries = Object.entries(data).sort((a, b) => {
                    const aMissing = a[1] === SILHOUETTE_URL;
                    const bMissing = b[1] === SILHOUETTE_URL;
                    if (aMissing && !bMissing) return -1;
                    if (!aMissing && bMissing) return 1;
                    return a[0].localeCompare(b[0]);
                });

                entries.forEach(([name, url]) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    if (url === SILHOUETTE_URL) {
                        card.classList.add('missing');
                    }
                    
                    const img = document.createElement('img');
                    img.src = url;
                    img.alt = name;
                    img.loading = "lazy";
                    
                    const title = document.createElement('h3');
                    title.textContent = name;
                    
                    card.appendChild(img);
                    card.appendChild(title);
                    grid.appendChild(card);
                });
            });
    </script>
</body>
</html>
